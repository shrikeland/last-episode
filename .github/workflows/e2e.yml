name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All runs hit production with the same test users: TC-AUTH-010 signs out globally and
# tests add / delete throwaway titles, so parallel runs break each other — queue them instead.
concurrency:
  group: e2e-production
  cancel-in-progress: false

jobs:
  e2e:
    # PRs run only the @smoke-tagged tests (~2 min); the full suite runs after merge on push to main
    name: Playwright (chromium, ${{ github.event_name == 'pull_request' && 'smoke' || 'full' }})
    runs-on: ubuntu-latest
    # playwright.config.ts stops the run at 25 min (globalTimeout) — the rest is install + report upload
    timeout-minutes: 30
    # TEST_USER_*, TEST_USER2_* and VERCEL_BYPASS_SECRET are environment secrets of "Production",
    # not repository secrets — without this they resolve to empty strings.
    # deployment: false — only borrow the secrets, don't create a GitHub deployment per run.
    environment:
      name: Production
      deployment: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: e2e
        env:
          BASE_URL: https://www.episode.watch
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          TEST_USER2_EMAIL: ${{ secrets.TEST_USER2_EMAIL }}
          TEST_USER2_PASSWORD: ${{ secrets.TEST_USER2_PASSWORD }}
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          HEADLESS: true
          CI: true
          GREP_ARGS: ${{ github.event_name == 'pull_request' && '--grep @smoke' || '' }}
        # All projects: setup → seed → guest / user → logout. `--grep` filters only guest / user / logout;
        # setup and seed are dependencies of `user` and always run in full
        run: npx playwright test $GREP_ARGS

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
